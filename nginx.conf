# =============================================================
#  Le Mondrian — configuration nginx pour le site statique
#  (servie dans le conteneur, montée sur /etc/nginx/conf.d/default.conf)
# =============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------
    #  Compression
    # ---------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # ---------------------------------------------------------
    #  En-têtes de sécurité
    #  (déclarés au niveau server : hérités par tous les blocs
    #   ci-dessous qui n'ont pas leurs propres add_header)
    # ---------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------
    #  Assets compilés par Vite : noms fingerprintés (index-<hash>.js)
    #  -> cache navigateur quasi permanent
    # ---------------------------------------------------------
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------
    #  Photographies : noms stables -> cache 30 jours
    # ---------------------------------------------------------
    location /images/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # ---------------------------------------------------------
    #  index.html : jamais mis en cache, pour que chaque
    #  déploiement soit immédiatement visible
    # ---------------------------------------------------------
    location = /index.html {
        expires -1;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---------------------------------------------------------
    #  Routage SPA : l'application gère elle-même ses pages
    #  (état React + hash), toute URL inconnue renvoie index.html
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
